name: stcn_env
channels:
  - pytorch
  - conda-forge
  - defaults
dependencies:
  - python=3.10
  - pytorch::pytorch
  - pytorch::pytorch-cuda=11.8
  - pytorch::torchvision
  - pytorch::torchaudio
  - numpy
  - scipy
  - pandas
  - matplotlib
  - git
  - pip
  - pip:
    - torch==2.1.2
    - torchvision==0.16.2
    - torchaudio==2.1.2
    - transformers==4.36.2
    - tokenizers==0.15.0
    - tqdm==4.67.0
    - scipy==1.11.4
    - pandas==2.1.4
    - matplotlib==3.8.2
    - tensorboard==2.15.1
    - tensorboardX==2.6.2
    - nlgeval==0.4.1
    - pycocoevalcap==1.2
    - huggingface-hub==0.20.1
    - sentencepiece==0.1.99
    - scikit-learn==1.3.2
    - opencv-python==4.8.1.78
    - Pillow==10.1.0
    - requests==2.31.0
    - pyyaml==6.0.1
